name: Deploy Production FBSV2 to Kubernetesss

on:
  push:
    branches: ["main"]

env:
  KUBECTL: /usr/local/bin/kubectl
  IMAGE_NAME: qr-form
  DEPLOYMENT: react-app
  CONTAINER: react

jobs:
  deploy:
    runs-on: [self-hosted, k3smaster]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout Code ke runner
        uses: actions/checkout@v4

      - name: Set Image Tag (date)
        run: echo "IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Set Repository Name (Lowercase)
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ENV_FILE=.env
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy ke Cluster Kubernetes
        env:
          KUBECONFIG: /home/itdev/.kube/config
        run: |
          IMAGE="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}"

          $KUBECTL apply -f react-service-lb.yaml
          $KUBECTL apply -f react-deployment.yaml
          $KUBECTL set image deployment/${DEPLOYMENT} ${CONTAINER}=${IMAGE}
          $KUBECTL rollout status deployment/${DEPLOYMENT} --timeout=5m

      - name: Tampilkan kondisi pod jika gagal
        if: failure()
        env:
          KUBECONFIG: /home/itdev/.kube/config
        run: |
          echo "=== STATUS PODS ==="
          $KUBECTL get pods -l app=react -o wide || true
          
          echo "=== DETAIL POD TERAKHIR ==="
          $KUBECTL describe pods -l app=react || true
          
          echo "=== LOG CONTAINER ==="
          $KUBECTL logs -l app=react --tail=50 || true

      - name: Hapus image lama di Runner
        if: always()
        run: docker image prune -f
